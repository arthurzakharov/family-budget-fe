# Render Blueprint for the whole app: frontend (this repo), backend (family-budget-be) and Postgres.
# Render dashboard -> New -> Blueprint -> pick this repo. Render needs access to both GitHub repos.
#
# On the first sync Render asks for the `sync: false` values below; the service URLs only exist
# after that, so fill API_URL / ALLOWED_ORIGINS with the onrender.com URLs and redeploy once.

services:
  - type: web
    name: family-budget-fe
    runtime: docker
    repo: https://github.com/arthurzakharov/family-budget-fe
    branch: main
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      # Backend's public URL, e.g. https://family-budget-be.onrender.com
      - key: API_URL
        sync: false
      # GitHub token with read:packages; used only at build time to install the be-client package.
      - key: GITHUB_TOKEN
        sync: false

  - type: web
    name: family-budget-be
    runtime: docker
    repo: https://github.com/arthurzakharov/family-budget-be
    branch: main
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: family-budget-db
          property: connectionString
      # Frontend's public URL, e.g. https://family-budget-fe.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: family-budget-db
    databaseName: family_budget
    user: family_budget
    # Free Render Postgres expires 30 days after creation; switch to a paid plan
    # (e.g. basic-256mb) before relying on it for real data.
    plan: free
